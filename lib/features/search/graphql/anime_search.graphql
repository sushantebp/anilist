
# anime queries search

# search keyword is passed to endpoint
# minimal metadata like(id,title,cover image(medium)) are suggested

query AnimeSearch($search: String, $page: Int, $perPage: Int) {
  Page(page: $page, perPage: $perPage) {
    media(search: $search, type: ANIME) {
      id
      title {
        english
      }
      coverImage {
        medium
      }
    }
  }
}
